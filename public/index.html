<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Low Stock Finder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light;
    --bg: #f7f7f9;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e2e2e6;
    --accent: #2563eb;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem 1rem;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 1.5rem; font-size: 0.9rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
  }
  .controls {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    align-items: end;
    margin-bottom: 1rem;
  }
  .field { display: flex; flex-direction: column; gap: 0.35rem; }
  label { font-size: 0.8rem; color: var(--muted); }
  input, select {
    padding: 0.5rem 0.6rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.95rem;
    min-width: 180px;
  }
  button {
    padding: 0.55rem 1.1rem;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
  th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  th { color: var(--muted); font-weight: 600; }
  td.qty { font-variant-numeric: tabular-nums; }
  td.qty.low { color: var(--danger); font-weight: 600; }
  .status { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
  .error { background: var(--danger-bg); color: var(--danger); padding: 0.6rem 0.8rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 1rem 0; }
  button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  @media print {
    body { padding: 0; background: white; }
    .controls, .error, .no-print { display: none !important; }
    .card { border: none; padding: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Low Stock Finder</h1>

  <div class="card">
    <div class="controls">
      <div class="field">
        <label for="threshold">Threshold (quantity &lt;)</label>
        <input id="threshold" type="number" value="50" min="0" step="1">
      </div>
      <div class="field">
        <label for="folder">Model / Category</label>
        <select id="folder">
          <option value="">All categories</option>
        </select>
      </div>
      <button id="search">Search</button>
      <button id="printBtn" class="secondary no-print" type="button">Print</button>
    </div>

    <div id="status" class="status"></div>
    <div id="error" class="error" style="display:none;"></div>
    <div id="results"></div>
  </div>
</div>

<script>
const thresholdEl = document.getElementById('threshold');
const folderEl = document.getElementById('folder');
const searchBtn = document.getElementById('search');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const resultsEl = document.getElementById('results');

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
}
function clearError() {
  errorEl.style.display = 'none';
  errorEl.textContent = '';
}

async function loadFolders() {
  try {
    const r = await fetch('/api/folders');
    if (!r.ok) throw new Error('Failed to load categories (' + r.status + ')');
    const data = await r.json();
    data.folders.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      folderEl.appendChild(opt);
    });
  } catch (err) {
    showError(err.message);
  }
}

function renderResults(data) {
  resultsEl.innerHTML = '';
  if (!data.items.length) {
    resultsEl.innerHTML = '<div class="empty">No items below the threshold' + (data.folder ? ' in "' + data.folder + '"' : '') + '.</div>';
    return;
  }
  const table = document.createElement('table');
  table.innerHTML = `
    <thead>
      <tr><th>Item</th><th>Available Qty</th><th>Reorder Qty</th></tr>
    </thead>
    <tbody>
      ${data.items.map(it => `
        <tr>
          <td>${escapeHtml(it.name)}</td>
          <td class="qty ${it.quantity <= 0 ? 'low' : ''}">${it.quantity}</td>
          <td class="qty">${it.reorderQty}</td>
        </tr>
      `).join('')}
    </tbody>
  `;
  resultsEl.appendChild(table);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function runSearch() {
  clearError();
  searchBtn.disabled = true;
  statusEl.textContent = 'Loading...';
  resultsEl.innerHTML = '';
  try {
    const threshold = thresholdEl.value || 50;
    const folder = folderEl.value;
    const params = new URLSearchParams({ threshold });
    if (folder) params.set('folder', folder);
    const r = await fetch('/api/low-stock?' + params.toString());
    if (!r.ok) {
      const body = await r.json().catch(() => ({}));
      throw new Error(body.error || ('Request failed (' + r.status + ')'));
    }
    const data = await r.json();
    statusEl.textContent = data.count + ' item(s) below quantity ' + data.threshold + (data.folder ? ' in "' + data.folder + '"' : '');
    renderResults(data);
  } catch (err) {
    statusEl.textContent = '';
    showError(err.message);
  } finally {
    searchBtn.disabled = false;
  }
}

const printBtn = document.getElementById('printBtn');
printBtn.addEventListener('click', () => window.print());

searchBtn.addEventListener('click', runSearch);
thresholdEl.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });

loadFolders().then(runSearch);
</script>
</body>
</html>
