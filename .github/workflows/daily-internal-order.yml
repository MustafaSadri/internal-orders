name: Daily Internal Order

on:
  schedule:
    - cron: '30 14 * * *' # 17:30 Moscow time (UTC+3)
  workflow_dispatch: {}

jobs:
  create-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/create-internal-order.js
        env:
          TOKEN: ${{ secrets.MOYSKLAD_TOKEN }}
